server {
    listen 80;
    server_name _;

    location /api/ {
        proxy_pass http://127.0.0.1:8181/api/;
        proxy_set_header Content-Type application/json;
        client_max_body_size 2m;
        # /api/deploy streams docker compose's output line by line as it
        # happens (see deploy-server.py) — buffering here would defeat
        # that, arriving all at once only after the backend closes the
        # connection. The read timeout is bumped to comfortably exceed
        # the backend's own 300s deploy timeout, so a quiet stretch
        # (e.g. a slow image pull) doesn't get cut off by nginx first.
        proxy_buffering off;
        proxy_read_timeout 320s;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ =404;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
